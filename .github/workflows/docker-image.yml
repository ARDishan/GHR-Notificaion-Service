name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ardishan/ghr-notificaion-service

jobs:

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    runs-on: self-hosted

    steps:

      - name: Deploy Notification Service
        run: |
          cd /opt/apps/GHR-Notificaion-Service

          echo "Pulling latest Docker image..."
          docker compose pull

          echo "Starting updated container..."
          docker compose up -d

          echo "Waiting for container to become healthy..."

          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' notification-service 2>/dev/null || echo "starting")

            echo "Health status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Deployment successful!"
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "Container became unhealthy."
              docker compose logs --tail=100
              exit 1
            fi

            sleep 2
          done

          echo "Container did not become healthy within 60 seconds."
          docker compose logs --tail=100
          exit 1